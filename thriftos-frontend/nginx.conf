server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text (fonts and images are already compressed).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript
               application/manifest+json image/svg+xml;

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files (main-AbC1_dE2.js, chunk-*.js, styles-*.css, media/*) never change: cache for a year.
    # Quoted: an unquoted {8} would be read as the start of a block.
    location ~ "^/(.+-[A-Za-z0-9_-]{8}\.(js|css)|media/.+)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page, the service worker and its manifest must always be checked, so updates reach the phone.
    location ~* ^/(index\.html|version\.json|ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest|i18n/.+)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA routing - serve index.html for non-file routes
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
