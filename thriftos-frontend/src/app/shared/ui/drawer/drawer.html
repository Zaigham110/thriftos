@if (isOpen()) {
  <div class="drawer-overlay" (click)="onBackdropClick()">
    <div
      [class]="drawerClasses"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? 'drawer-title' : null"
      (click)="$event.stopPropagation()"
    >
      <div class="drawer-header">
        @if (title()) {
          <h2 id="drawer-title" class="drawer-title">{{ title() }}</h2>
        }
        @if (closable()) {
          <button
            type="button"
            class="drawer-close"
            aria-label="Close drawer"
            (click)="close()"
          >
            <lucide-icon [img]="closeIcon" [size]="20"></lucide-icon>
          </button>
        }
      </div>
      <div class="drawer-body">
        <ng-content></ng-content>
      </div>
      <ng-content select="[drawer-footer]"></ng-content>
    </div>
  </div>
}
