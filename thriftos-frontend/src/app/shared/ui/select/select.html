<div class="select-wrapper">
  @if (label()) {
    <label [for]="id()" class="select-label">
      {{ label() }}
      @if (required()) {
        <span class="select-required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="select-container">
    <select
      [id]="id()"
      [class]="selectClasses"
      [disabled]="disabled() || isDisabled()"
      [required]="required()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
      [value]="value()"
      (change)="onSelectChange($event)"
      (blur)="onBlur()"
    >
      @if (placeholder()) {
        <option value="" disabled>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled">
          {{ option.label }}
        </option>
      }
    </select>
    <div class="select-icon">
      <lucide-icon [img]="chevronIcon" [size]="16"></lucide-icon>
    </div>
  </div>

  @if (hint() && !error()) {
    <span [id]="id() + '-hint'" class="select-hint">{{ hint() }}</span>
  }

  @if (error()) {
    <span [id]="id() + '-error'" class="select-error-text" role="alert">{{ error() }}</span>
  }
</div>
