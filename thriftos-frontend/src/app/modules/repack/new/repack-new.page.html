<app-page>
  <app-page-header>
    <div class="header-left-group">
      <div class="eyebrow-container">
        <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
      </div>
      <h1 class="page-title">Create Repack Unit</h1>
      <p class="page-subtitle">Initialize a new repack batch unit to consolidate Grade Outputs into finished inventory items.</p>
    </div>

    <div class="header-right-actions">
      <button class="btn btn-secondary" (click)="cancel()">
        <lucide-icon [img]="icons.ArrowLeft" [size]="15"></lucide-icon>
        Cancel
      </button>

      <button class="btn btn-primary" (click)="createDraft()" [disabled]="creating() || loading()">
        <lucide-icon [img]="icons.Plus" [size]="15"></lucide-icon>
        Create & Open Workspace
      </button>
    </div>
  </app-page-header>

  <app-page-body>
    @if (error()) {
      <app-error-state
        [message]="error()!"
        (retry)="error.set(null)"
      ></app-error-state>
    }

    @if (loading()) {
      <app-loading message="Loading categories and grades…"></app-loading>
    } @else {
      <div class="form-container">
        <div class="form-card">
          <div class="card-header">
            <lucide-icon [img]="icons.Box" [size]="18" class="header-icon"></lucide-icon>
            <h3>Repack Unit Batch Specifications</h3>
          </div>

          <div class="form-grid">
            <div class="form-group flex-1">
              <label class="form-label">Target Category</label>
              <select [formControl]="categoryId" class="form-select">
                <option value="">Select Raw / Graded Category...</option>
                @for (cat of categoryOptions(); track cat.value) {
                  <option [value]="cat.value">{{ cat.label }}</option>
                }
              </select>
            </div>

            <div class="form-group flex-1">
              <label class="form-label">Quality Grade</label>
              <select [formControl]="gradeId" class="form-select">
                <option value="">Select Quality Grade...</option>
                @for (g of gradeOptions(); track g.value) {
                  <option [value]="g.value">{{ g.label }}</option>
                }
              </select>
            </div>

            <div class="form-group flex-1">
              <label class="form-label">Measurement Type</label>
              <div class="unit-toggle-group">
                <button
                  type="button"
                  class="unit-toggle-btn"
                  [class.active]="measurementType.value === 'WEIGHT'"
                  (click)="measurementType.setValue('WEIGHT')"
                >Weight (KG)</button>
                <button
                  type="button"
                  class="unit-toggle-btn"
                  [class.active]="measurementType.value === 'QUANTITY'"
                  (click)="measurementType.setValue('QUANTITY')"
                >Quantity (PCS)</button>
              </div>
            </div>

            <div class="form-group flex-1">
              <label class="form-label">Target Amount</label>
              <div class="input-with-addon">
                <input
                  type="number"
                  step="0.01"
                  min="0.01"
                  [formControl]="targetAmount"
                  class="form-input"
                  placeholder="100.00"
                />
                <span class="input-addon font-mono">{{ measurementType.value === 'WEIGHT' ? 'KG' : 'PCS' }}</span>
              </div>
            </div>
          </div>

          <div class="form-actions mt-4">
            <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
            <button class="btn btn-primary" (click)="createDraft()" [disabled]="creating()">
              <lucide-icon [img]="icons.Plus" [size]="15"></lucide-icon>
              Create Draft Batch
            </button>
          </div>
        </div>
      </div>
    }
  </app-page-body>
</app-page>
