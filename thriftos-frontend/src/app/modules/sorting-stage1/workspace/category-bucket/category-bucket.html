<ui-card class="category-bucket" [class.category-bucket--waste]="isWaste()" [class.category-bucket--editing]="isEditing()">
  <div class="bucket-header">
    <span class="category-name">{{ getCategoryName() }}</span>
    
    @if (editable() && !isEditing()) {
      <div class="bucket-actions">
        <button class="icon-btn" (click)="startEdit()" title="Edit">
          <lucide-icon [img]="icons.edit" size="14"></lucide-icon>
        </button>
        @if (!isWaste()) {
          <button class="icon-btn icon-btn--danger" (click)="confirmDelete()" title="Delete">
            <lucide-icon [img]="icons.trash" size="14"></lucide-icon>
          </button>
        }
      </div>
    }
  </div>

  @if (isEditing()) {
    <!-- Edit Mode -->
    <div class="bucket-edit">
      <div class="input-row">
        <div class="input-group">
          <label>
            <lucide-icon [img]="icons.scale" size="14"></lucide-icon>
            Weight (kg)
          </label>
          <input
            type="number"
            class="bucket-input"
            [value]="editWeight()"
            (input)="onWeightChange($event)"
            min="0"
            step="0.01"
          />
        </div>
        <div class="input-group">
          <label>
            <lucide-icon [img]="icons.hash" size="14"></lucide-icon>
            Count
          </label>
          <input
            type="number"
            class="bucket-input"
            [value]="editCount()"
            (input)="onCountChange($event)"
            min="0"
            step="1"
          />
        </div>
      </div>
      <div class="edit-actions">
        <ui-button variant="ghost" size="sm" (click)="cancelEdit()">
          Cancel
        </ui-button>
        <ui-button variant="primary" size="sm" (click)="saveEdit()">
          <lucide-icon [img]="icons.save" size="14"></lucide-icon>
          Save
        </ui-button>
      </div>
    </div>
  } @else {
    <!-- View Mode -->
    <div class="bucket-stats">
      <div class="stat">
        <lucide-icon [img]="icons.scale" size="16"></lucide-icon>
        <span class="stat-value font-mono">{{ formatWeight(bucket().outputWeightKg) }}</span>
        <span class="stat-unit">kg</span>
      </div>
      <div class="stat">
        <lucide-icon [img]="icons.hash" size="16"></lucide-icon>
        <span class="stat-value font-mono">{{ bucket().outputCount }}</span>
        <span class="stat-unit">items</span>
      </div>
    </div>
  }
</ui-card>
