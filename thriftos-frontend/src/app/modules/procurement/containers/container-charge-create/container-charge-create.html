<app-page>
  <app-page-header>
    <app-stack direction="vertical" spacing="xs">
      <app-breadcrumb [items]="breadcrumbs()" />
      <h1 class="page-title">Add charge</h1>
      @if (container(); as cont) {
        <p class="page-subtitle">{{ cont.containerNumber }}</p>
      }
    </app-stack>

    <div class="actions">
      <app-button variant="secondary" (click)="onCancel()">Cancel</app-button>
    </div>
  </app-page-header>

  <app-page-body>
    @if (loading()) {
      <app-loading message="Loading container…" />
    } @else if (error()) {
      <app-error-state title="Failed" [message]="error()!" [action]="true">
        <app-button action variant="secondary" (click)="loadContainer()">Retry</app-button>
      </app-error-state>
    } @else if (container(); as cont) {
      <app-card>
        <app-form
          [formGroup]="form"
          (submitted)="onSubmit()"
          title="Add Charge"
          subtitle="Charges are enforced server-side in the container currency."
        >
          <app-form-field label="Charge Type" [required]="true">
            <app-select formControlName="chargeType" [options]="chargeTypeOptions" />
          </app-form-field>

          <app-form-field label="Description" [required]="true">
            <app-input formControlName="description" placeholder="Enter charge description" />
          </app-form-field>

          <app-form-field label="Amount" [required]="true" [hint]="'Currency: ' + currencyCode()">
            <app-input type="number" formControlName="amount" placeholder="0.00" />
          </app-form-field>

          <app-stack direction="horizontal" spacing="sm">
            <app-button variant="secondary" type="button" (click)="onCancel()" [disabled]="actionLoading()">
              Cancel
            </app-button>
            <app-button variant="primary" type="submit" [disabled]="form.invalid || actionLoading()">
              Create
            </app-button>
          </app-stack>
        </app-form>
      </app-card>
    }
  </app-page-body>
</app-page>
