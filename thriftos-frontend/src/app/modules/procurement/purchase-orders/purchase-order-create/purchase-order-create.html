<app-page>
  <app-page-header>
    <app-stack direction="vertical" spacing="xs">
      <app-breadcrumb [items]="breadcrumbs" />
      <h1 class="page-title">Create Purchase Order</h1>
      <p class="page-subtitle">Start a new container or loose bale procurement</p>
    </app-stack>
    <div class="actions"></div>
  </app-page-header>

  <app-page-body>
    <app-section>
      <app-section-header>
        <h2 class="section-title">Details</h2>
        <div class="actions"></div>
      </app-section-header>
      <app-section-body>
        @if (error()) {
          <app-error-state title="Failed to create" [message]="error()!" />
        }

        <app-card>
          <app-form [formGroup]="form" (submitted)="onSubmit()" title="Purchase Order" subtitle="Fields marked * are required.">
            <app-form-field label="Procurement Type" [required]="true">
              <app-select formControlName="poType" [options]="poTypeOptions" />
            </app-form-field>

            <app-form-field label="Vendor" hint="Optional">
              <app-select formControlName="vendorId" [options]="vendorOptions()" />
            </app-form-field>

            <app-stack direction="horizontal" spacing="sm">
              <app-button variant="secondary" type="button" (click)="cancel()">Cancel</app-button>
              <app-button variant="primary" type="submit" [disabled]="form.invalid || isSubmitting()">Create</app-button>
            </app-stack>
          </app-form>
        </app-card>
      </app-section-body>
    </app-section>
  </app-page-body>
</app-page>
