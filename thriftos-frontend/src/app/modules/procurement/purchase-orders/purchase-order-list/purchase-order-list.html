<app-page>
  <app-page-header>
    <app-stack direction="vertical" spacing="xs">
      <app-breadcrumb [items]="breadcrumbs" />
      <h1 class="page-title">Purchase Orders</h1>
      <p class="page-subtitle">{{ totalCount() }} orders</p>
    </app-stack>

    <div class="actions">
      <app-button variant="secondary" (click)="refresh()" [disabled]="loading()">Refresh</app-button>
      @if (canCreate()) {
        <app-button variant="primary" [routerLink]="['/procurement/pos/create']">New Purchase Order</app-button>
      }
    </div>
  </app-page-header>

  <app-page-body>
    <ng-container *ngIf="error(); else table">
      <app-error-state title="Failed to load purchase orders" [message]="error() ?? undefined" />
    </ng-container>

    <ng-template #table>
      <app-data-table
        title="Purchase Orders"
        [columns]="tableColumns"
        [data]="purchaseOrders()"
        [loading]="loading()"
        [serverSide]="true"
        [totalCount]="totalCount()"
        [externalPageIndex]="currentPage()"
        (stateChange)="onTableStateChange($event)"
        (rowClick)="onRowClick($event)"
      >
        <ng-template #cellTemplate let-row let-column="column">
          <ng-container [ngSwitch]="column.key">
            <span *ngSwitchCase="'totalCost'" class="tabular-nums">{{ row.totalCost | currency }}</span>
            <app-badge *ngSwitchCase="'status'" [variant]="getStatusVariant(row.status)">{{ row.status }}</app-badge>
            <ng-container *ngSwitchCase="'createdAt'">{{ row.createdAt | date: 'mediumDate' }}</ng-container>
            <ng-container *ngSwitchDefault>
              {{ column.getValue ? column.getValue(row) : row[column.key] }}
            </ng-container>
          </ng-container>
        </ng-template>

        <ng-template #rowActions let-row>
          <app-button variant="secondary" size="sm" (click)="$event.stopPropagation(); onRowClick(row)">View</app-button>
        </ng-template>
      </app-data-table>
    </ng-template>
  </app-page-body>
</app-page>
