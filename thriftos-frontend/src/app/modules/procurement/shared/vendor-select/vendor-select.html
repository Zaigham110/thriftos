<div class="vendor-select">
  <div class="vendor-select__row">
    <div class="vendor-select__control">
      <app-form-field [label]="label()" [hint]="hint()" [required]="required()">
        <app-select
          [options]="vendorOptions()"
          placeholder="Select a vendor…"
          [disabled]="disabled()"
          [formControl]="vendorIdControl"
        />
      </app-form-field>
    </div>

    @if (showAddButton() && !disabled()) {
      <app-button type="button" variant="secondary" (click)="openAddVendorDrawer()" [disabled]="isCreating()">
        Add vendor
      </app-button>
    }
  </div>
</div>

@if (isDrawerOpen()) {
  <app-card>
    @if (createError()) {
      <app-error-state title="Failed to create vendor" [message]="createError()!" [action]="true">
        <app-button action type="button" variant="secondary" (click)="createError.set(null)">
          Dismiss
        </app-button>
      </app-error-state>
    }

    <app-form
      [formGroup]="vendorForm"
      (submitted)="onSubmitVendor()"
      title="Add Vendor"
      subtitle="Create a new vendor for procurement."
    >
      <app-form-field label="Vendor Name" [required]="true" hint="Company or individual name">
        <app-input formControlName="name" placeholder="Enter vendor name" />
      </app-form-field>

      <app-form-field label="Country" hint="Country of origin">
        <app-input formControlName="country" placeholder="e.g., France, USA, UK" />
      </app-form-field>

      <app-form-field label="Contact Information" hint="Optional contact details">
        <app-textarea formControlName="contactInfo" placeholder="Phone, email, address…" />
      </app-form-field>

      <div class="vendor-form-actions">
        <app-button type="button" variant="secondary" (click)="closeDrawer()" [disabled]="isCreating()">
          Cancel
        </app-button>
        <app-button type="submit" variant="primary" [disabled]="vendorForm.invalid || isCreating()">
          Create Vendor
        </app-button>
      </div>
    </app-form>
  </app-card>
}
