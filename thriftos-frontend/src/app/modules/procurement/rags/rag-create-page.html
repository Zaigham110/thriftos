<app-page>
  <app-page-header>
    <div class="header-left-group">
      <div class="eyebrow-container">
        <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
      </div>
      <h1 class="page-title">Register Intake Rag / Bale</h1>
      @if (container(); as cont) {
        <p class="page-subtitle">Log intake weight and raw category for container <strong>{{ cont.containerNumber }}</strong>.</p>
      }
    </div>

    <div class="header-right-actions">
      <button class="btn btn-secondary" (click)="onCancel()">
        <lucide-icon [img]="icons.ArrowLeft" [size]="15"></lucide-icon>
        Back to Container Details
      </button>
    </div>
  </app-page-header>

  <app-page-body>
    @if (loading()) {
      <app-loading message="Loading container intake details…"></app-loading>
    } @else if (error()) {
      <app-error-state
        [message]="error()!"
        (retry)="onCancel()"
      ></app-error-state>
    } @else if (container(); as cont) {
      <app-rag-create-drawer
        [containerId]="cont.id"
        [containerNumber]="cont.containerNumber"
        [containerNetWeight]="cont.netWeight"
        [containerCurrentWeight]="ragsWeightTotal()"
        (created)="onCreated()"
        (closed)="onCancel()"
      ></app-rag-create-drawer>
    }
  </app-page-body>
</app-page>
