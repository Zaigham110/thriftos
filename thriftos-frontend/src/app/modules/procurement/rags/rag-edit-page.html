<app-page>
  <app-page-header>
    <div class="header-left-group">
      <div class="eyebrow-container">
        <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
      </div>
      <h1 class="page-title">Edit Intake Rag / Bale</h1>
      @if (rag(); as r) {
        <p class="page-subtitle">Update intake weight and handling notes for item <strong>{{ r.ragCode }}</strong>.</p>
      }
    </div>

    <div class="header-right-actions">
      <button class="btn btn-secondary" (click)="onCancel()">
        <lucide-icon [img]="icons.ArrowLeft" [size]="15"></lucide-icon>
        Back to Container
      </button>
    </div>
  </app-page-header>

  <app-page-body>
    @if (loading()) {
      <app-loading message="Loading intake item details…"></app-loading>
    } @else if (error()) {
      <app-error-state
        [message]="error()!"
        (retry)="onCancel()"
      ></app-error-state>
    } @else if (rag(); as r) {
      <app-rag-edit-drawer
        [rag]="r"
        (updated)="onUpdated()"
        (closed)="onCancel()"
      ></app-rag-edit-drawer>
    }
  </app-page-body>
</app-page>
