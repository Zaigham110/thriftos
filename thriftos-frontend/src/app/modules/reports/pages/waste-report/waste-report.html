<app-page>
  <app-page-header>
    <app-stack direction="vertical" spacing="xs">
      <app-breadcrumb [items]="breadcrumbs" />
      <h1 class="page-title">Waste Report</h1>
      <p class="page-subtitle">Waste analysis by stage and cost impact</p>
    </app-stack>
    <div class="actions">
      <app-button variant="secondary" (click)="loadData()">
        Refresh
      </app-button>
    </div>
  </app-page-header>

  <app-page-body>
    @if (error()) {
      <app-error-state title="Failed to load report" [message]="error()!" [action]="true">
        <app-button action variant="secondary" (click)="loadData()">Retry</app-button>
      </app-error-state>
    }

    <!-- Filters -->
    <app-section>
      <app-section-body>
        <app-report-filters
          [showExport]="true"
          [exporting]="exporting"
          (filtersChange)="onFiltersChange($event)"
          (searchChange)="onSearchChange($event)"
          (onExport)="exportReport()"
        />
      </app-section-body>
    </app-section>

    <!-- View Toggle & Data Table -->
    <app-section>
      <app-section-header>
        <div class="flex items-center justify-between w-full">
          <h2 class="section-title">Waste Breakdown</h2>
          <div class="flex gap-2">
            <app-button 
              [variant]="activeView() === 'by-stage' ? 'primary' : 'secondary'" 
              (click)="setView('by-stage')">
              By Stage
            </app-button>
            <app-button 
              [variant]="activeView() === 'cost-impact' ? 'primary' : 'secondary'" 
              (click)="setView('cost-impact')">
              Cost Impact
            </app-button>
          </div>
        </div>
      </app-section-header>
      <app-section-body>
        <app-data-table
          [data]="currentData"
          [columns]="columns"
          [loading]="loading()"
          [enableSearch]="false"
          [externalSearch]="searchText()"
        >
          <ng-template #cellTemplate let-row let-column="column">
            @switch (column.key) {
              @case ('wasteKg') {
                {{ formatWeight(row.wasteKg) }}
              }
              @case ('wasteCost') {
                {{ formatCurrency(row.wasteCost) }}
              }
              @default {
                {{ row[column.key] }}
              }
            }
          </ng-template>
        </app-data-table>
      </app-section-body>
    </app-section>
  </app-page-body>
</app-page>
