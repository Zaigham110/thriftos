<app-page>
  <app-page-header>
    <app-stack direction="vertical" spacing="xs">
      <app-breadcrumb [items]="breadcrumbs" />
      <h1 class="page-title">Reports & Analytics</h1>
      <p class="page-subtitle">Table-first data analysis — reproducible, traceable, date-bounded</p>
    </app-stack>
  </app-page-header>

  <app-page-body>
    <!-- Available Reports (Dense Table) -->
    <app-section>
      <app-section-header>
        <h2 class="section-title">Available Reports</h2>
      </app-section-header>
      <app-section-body>
        <app-data-table
          [columns]="reportColumns"
          [data]="reportLinks"
          [loading]="false"
          [serverSide]="false"
        >
          <ng-template #cellTemplate let-row let-column="column">
            @if (column.key === 'title') {
              <div class="report-title">
                <lucide-icon [img]="row.icon" size="18" class="report-icon"></lucide-icon>
                <strong>{{ row.title }}</strong>
              </div>
            } @else if (column.key === 'description') {
              <span class="text-muted">{{ row.description }}</span>
            } @else if (column.key === 'action') {
              <app-button variant="primary" [routerLink]="row.route">
                <lucide-icon [img]="icons.FileBarChart"></lucide-icon>
                View Report
              </app-button>
            }
          </ng-template>
        </app-data-table>
      </app-section-body>
    </app-section>
  </app-page-body>
</app-page>
