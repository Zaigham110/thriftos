<ui-drawer [isOpen]="isOpen()" [title]="title" (closed)="close()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="vendor-form">
    @if (formError()) {
      <ui-alert variant="danger" [dismissible]="true" (dismissed)="formError.set(null)">
        {{ formError() }}
      </ui-alert>
    }

    <!-- Name Field -->
    <div class="form-group">
      <label for="name" class="form-label">Name <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-input"
        placeholder="Enter vendor name"
        [class.error]="form.get('name')?.invalid && form.get('name')?.touched"
      />
      @if (getFieldError('name')) {
        <span class="field-error">{{ getFieldError('name') }}</span>
      }
    </div>

    <!-- Country Field -->
    <div class="form-group">
      <label for="country" class="form-label">Country</label>
      <input
        type="text"
        id="country"
        formControlName="country"
        class="form-input"
        placeholder="e.g., Pakistan"
      />
    </div>

    <!-- Contact Info Field -->
    <div class="form-group">
      <label for="contactInfo" class="form-label">Contact Info</label>
      <textarea
        id="contactInfo"
        formControlName="contactInfo"
        class="form-input form-textarea"
        placeholder="Optional notes: phone, email, address, contact person, terms"
        rows="4"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="close()"
        [disabled]="saving()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="saving() || form.invalid"
      >
        @if (saving()) {
          <lucide-icon [img]="icons.Loader2" class="icon-spin"></lucide-icon>
          Saving...
        } @else {
          <lucide-icon [img]="icons.Save"></lucide-icon>
          {{ isEditMode ? 'Update Vendor' : 'Create Vendor' }}
        }
      </button>
    </div>
  </form>
</ui-drawer>
