<ui-drawer [isOpen]="isOpen()" [title]="title" (closed)="close()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="vendor-form">
    @if (formError()) {
      <ui-alert variant="danger" [dismissible]="true" (dismissed)="formError.set(null)">
        {{ formError() }}
      </ui-alert>
    }

    <!-- Name Field -->
    <div class="form-group">
      <label for="name" class="form-label">Name <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-input"
        placeholder="Enter vendor name"
        [class.error]="form.get('name')?.invalid && form.get('name')?.touched"
      />
      @if (getFieldError('name')) {
        <span class="field-error">{{ getFieldError('name') }}</span>
      }
    </div>

    <!-- Contact Person Field -->
    <div class="form-group">
      <label for="contactPerson" class="form-label">Contact Person</label>
      <input
        type="text"
        id="contactPerson"
        formControlName="contactPerson"
        class="form-input"
        placeholder="Primary contact name"
      />
    </div>

    <!-- Email Field -->
    <div class="form-group">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="form-input"
        placeholder="vendor@example.com"
        [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
      />
      @if (getFieldError('email')) {
        <span class="field-error">{{ getFieldError('email') }}</span>
      }
    </div>

    <!-- Phone Field -->
    <div class="form-group">
      <label for="phone" class="form-label">Phone</label>
      <input
        type="tel"
        id="phone"
        formControlName="phone"
        class="form-input"
        placeholder="+1 (555) 000-0000"
      />
    </div>

    <!-- Address Field -->
    <div class="form-group">
      <label for="address" class="form-label">Address</label>
      <textarea
        id="address"
        formControlName="address"
        class="form-input form-textarea"
        placeholder="Full address (optional)"
        rows="3"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="close()"
        [disabled]="saving()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="saving() || form.invalid || isEditMode"
      >
        @if (saving()) {
          <lucide-icon [img]="icons.Loader2" class="icon-spin"></lucide-icon>
          Saving...
        } @else {
          <lucide-icon [img]="icons.Save"></lucide-icon>
          {{ isEditMode ? 'Update Vendor' : 'Create Vendor' }}
        }
      </button>
    </div>
  </form>
</ui-drawer>
