<ui-drawer [isOpen]="isOpen()" [title]="title" (closed)="close()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grade-form">
    @if (formError()) {
      <ui-alert variant="danger" [dismissible]="true" (dismissed)="formError.set(null)">
        {{ formError() }}
      </ui-alert>
    }

    <!-- Name Field -->
    <div class="form-group">
      <label for="name" class="form-label">Name <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="form-input"
        placeholder="e.g., A, B, C, Premium"
        maxlength="10"
        [class.error]="form.get('name')?.invalid && form.get('name')?.touched"
      />
      <span class="field-hint">Short grade name (max 10 characters)</span>
      @if (getFieldError('name')) {
        <span class="field-error">{{ getFieldError('name') }}</span>
      }
    </div>

    <!-- Description Field -->
    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-input form-textarea"
        placeholder="Describe this grade level (optional)"
        rows="3"
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="close()"
        [disabled]="saving()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="saving() || form.invalid"
      >
        @if (saving()) {
          <lucide-icon [img]="icons.Loader2" class="icon-spin"></lucide-icon>
          Saving...
        } @else {
          <lucide-icon [img]="icons.Save"></lucide-icon>
          {{ isEditMode ? 'Update Grade' : 'Create Grade' }}
        }
      </button>
    </div>
  </form>
</ui-drawer>
