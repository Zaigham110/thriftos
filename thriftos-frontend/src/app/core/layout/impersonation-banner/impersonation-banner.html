@if (isImpersonating()) {
  <div class="impersonation-banner" role="alert">
    <div class="banner-content">
      <lucide-icon [img]="icons.AlertTriangle" [size]="18" class="banner-icon"></lucide-icon>
      <span class="banner-text">
        <strong>You are impersonating:</strong> {{ tenantName() }}
      </span>
    </div>
    <button 
      type="button" 
      class="exit-button"
      (click)="exitImpersonation()"
      [disabled]="isExiting()"
    >
      <lucide-icon [img]="icons.LogOut" [size]="16"></lucide-icon>
      <span>{{ isExiting() ? 'Exiting...' : 'Exit Impersonation' }}</span>
    </button>
  </div>
}
