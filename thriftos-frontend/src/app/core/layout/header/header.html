<header class="app-header">
  <!-- Left Section -->
  <div class="header-left">
    <button 
      type="button" 
      class="sidebar-toggle"
      (click)="onToggleSidebar()"
      aria-label="Toggle sidebar"
    >
      <lucide-icon [img]="icons.Menu" [size]="20"></lucide-icon>
    </button>

    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#2563EB" />
        <path d="M8 10h16v3H8v-3zm3 5h10v3H11v-3zm-3 5h16v3H8v-3z" fill="white" />
      </svg>
      <span class="brand-name">ThriftOS</span>
    </div>
  </div>

  <!-- Right Section -->
  <div class="header-right">
    <!-- Notifications -->
    <button type="button" class="icon-button" aria-label="Notifications">
      <lucide-icon [img]="icons.Bell" [size]="20"></lucide-icon>
    </button>

    <!-- User Menu -->
    <div class="user-menu-container" (clickOutside)="closeUserMenu()">
      <button 
        type="button" 
        class="user-menu-trigger"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="showUserMenu()"
      >
        <div class="user-avatar">
          <lucide-icon [img]="icons.User" [size]="18"></lucide-icon>
        </div>
        <span class="user-name">{{ userName() }}</span>
        <lucide-icon 
          [img]="icons.ChevronDown" 
          [size]="16"
          [class.rotated]="showUserMenu()"
        ></lucide-icon>
      </button>

      @if (showUserMenu()) {
        <div class="user-menu-dropdown">
          <div class="user-menu-header">
            <span class="menu-user-name">{{ userName() }}</span>
            <span class="menu-user-email">{{ userEmail() }}</span>
            @if (isSuperAdmin()) {
              <span class="super-admin-badge">Super Admin</span>
            }
          </div>
          <div class="user-menu-divider"></div>
          <button type="button" class="user-menu-item" (click)="onLogout()">
            <lucide-icon [img]="icons.LogOut" [size]="16"></lucide-icon>
            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
