name: Release

# A tag v* builds the ARM64 images (the server is a t4g, Graviton) on GitHub's ARM runners, pushes them
# to GHCR and publishes a GitHub release. The server deploys it on its own: every 2 minutes
# deploy/auto-deploy.sh compares GitHub's latest release with what runs and, when new, runs
# deploy/deploy.sh (backup → pull → start → health check → automatic rollback). GitHub holds no AWS or
# SSH credentials and nothing connects to the server. The last job waits until the public address
# reports the new version.
# Roll back: mark an older release as "Latest" on GitHub.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/zaigham110

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: web
            dockerfile: thriftos-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_HREF=/thriftos/
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/thriftos-${{ matrix.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release (the server picks it up)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A tag with a dash (v1.2.0-rc.1) is a prerelease: images only, never deployed (the server
        # follows GitHub's "latest" release, which skips prereleases).
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then flag=--prerelease; else flag=--latest; fi
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes $flag

  live:
    needs: release
    if: vars.APP_URL != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Wait until ${{ vars.APP_URL }}/thriftos runs ${{ github.ref_name }}
        run: |
          for _ in $(seq 1 60); do
            v=$(curl -fsS "${{ vars.APP_URL }}/thriftos/version.json?t=$(date +%s)" | jq -r .version || true)
            [ "$v" = "${{ github.ref_name }}" ] && { echo "Live: $v"; curl -fsS "${{ vars.APP_URL }}/thriftos/api/health"; exit 0; }
            echo "running: ${v:-?}"; sleep 15
          done
          echo "Not live after 15 minutes: check 'journalctl -u thriftos-deploy' on the server."; exit 1
