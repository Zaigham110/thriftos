name: CI

on:
  push:
    branches: [main, v1-reshape, v2-go-live]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thriftos
          POSTGRES_PASSWORD: thriftos
          POSTGRES_DB: thriftos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thriftos -d thriftos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://thriftos:thriftos@localhost:5432/thriftos_test?schema=public
      TEST_DATABASE_URL: postgresql://thriftos:thriftos@localhost:5432/thriftos_test?schema=public
      SHADOW_DATABASE_URL: postgresql://thriftos:thriftos@localhost:5432/thriftos_shadow?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - name: Dev-DB guard (migrate/reset/seed refuse non-*_test databases)
        run: npm run test:db-guard
      - run: npm run prisma:generate
        working-directory: server
      - name: Migrations match schema.prisma
        run: |
          PGPASSWORD=thriftos psql -h localhost -U thriftos -d thriftos_test -c 'CREATE DATABASE thriftos_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Costing rules fully covered
        run: npm run test:costing
        working-directory: server
      - run: npx nest build
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thriftos-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: thriftos-frontend/package-lock.json
      - run: npm ci
      - name: Every visible word in en and ur
        run: npm run i18n:check
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build with no warnings
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q 'WARNING' build.log; then echo 'The Angular build has warnings (see above). Fix them.'; exit 1; fi

  browser:
    # Playwright on a 360px phone against the production build (service worker on).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thriftos
          POSTGRES_PASSWORD: thriftos
          POSTGRES_DB: thriftos_pw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thriftos -d thriftos_pw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PW_DATABASE_URL: postgresql://thriftos:thriftos@localhost:5432/thriftos_pw_test?schema=public
      JWT_SECRET: ci-only-secret
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            thriftos-frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm ci
        working-directory: thriftos-frontend
      - run: npm run build
        working-directory: thriftos-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: thriftos-frontend
      - run: npm run e2e
        working-directory: thriftos-frontend
      - name: Demo journey on thriftos_demo (Urdu and English) and the offline sale
        run: npm run e2e:demo
        working-directory: thriftos-frontend
        env:
          DEMO_DATABASE_URL: postgresql://thriftos:thriftos@localhost:5432/thriftos_demo?schema=public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: thriftos-frontend/test-results

  deploy-config:
    # The production configs must load: nginx (web image), Caddy and the prod compose file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx config loads
        run: docker run --rm --add-host server:127.0.0.1 -v "$PWD/thriftos-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Caddyfile is valid
        run: docker run --rm -e APP_DOMAIN=app.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Production compose file resolves
        run: |
          cp deploy/env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
      - name: No .env file gets into the images
        run: grep -qx '\*\*/.env' .dockerignore
