version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thriftos-postgres
    restart: always
    environment:
      POSTGRES_USER: labur
      POSTGRES_PASSWORD: labur_dev_password
      POSTGRES_DB: thriftos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labur -d thriftos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thriftos-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: thriftos-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://labur:labur_dev_password@postgres:5432/thriftos?schema=public
      JWT_SECRET: super_secret_jwt_key_thriftos_v3
      CORS_ORIGIN: "http://localhost:4200,http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thriftos-net

  frontend:
    build:
      context: .
      dockerfile: thriftos-frontend/Dockerfile
    container_name: thriftos-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - server
    networks:
      - thriftos-net

volumes:
  postgres_data:

networks:
  thriftos-net:
    driver: bridge
