version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thriftos-postgres
    restart: always
    environment:
      POSTGRES_USER: labur
      POSTGRES_PASSWORD: labur_dev_password
      POSTGRES_DB: thriftos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labur -d thriftos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
