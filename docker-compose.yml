services:
  postgres:
    image: postgres:16-alpine
    container_name: thriftos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thriftos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thriftos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-thriftos} -d $${POSTGRES_DB:-thriftos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thriftos-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: thriftos-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-thriftos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-thriftos}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900s}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost:3000}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      # 1 = apply migrations when the container starts. Unset: only a *_test database is migrated.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-0}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thriftos-net

  frontend:
    build:
      context: .
      dockerfile: thriftos-frontend/Dockerfile
    container_name: thriftos-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - server
    networks:
      - thriftos-net

volumes:
  postgres_data:

networks:
  thriftos-net:
    driver: bridge
