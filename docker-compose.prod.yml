# Production stack for one small server (AWS EC2, 1 GB RAM + 2 GB swap). Nothing is built here:
# the server and web images are built by GitHub Actions and pulled from GHCR (task 5.2).
#
# On the server, /opt/thriftos holds this file, deploy/Caddyfile and .env.prod (secrets, never in git;
# template: deploy/env.prod.example). Start or update:
#   cd /opt/thriftos && THRIFTOS_TAG=v2.0.0 docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: thriftos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.prod}
    # Sized for 1 GB RAM shared with the API, nginx and Caddy.
    command: >-
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # No published port: only the API reaches the database.

  server:
    image: ghcr.io/zaigham110/thriftos-server:${THRIFTOS_TAG:?set THRIFTOS_TAG to the release tag}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-1}
      # One proxy (Caddy) in front: client IPs for rate limits and the audit log come from X-Forwarded-For.
      TRUST_PROXY: "1"
      UPLOAD_DIR: /data/uploads
      SEED_DATABASE: "false"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 384m
    logging: *logging

  web:
    image: ghcr.io/zaigham110/thriftos-web:${THRIFTOS_TAG:?set THRIFTOS_TAG to the release tag}
    restart: unless-stopped
    depends_on:
      - server
    mem_limit: 48m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server
    mem_limit: 96m
    logging: *logging

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
